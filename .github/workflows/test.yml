name: AgentDesk 质量检查

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装测试依赖
        run: python -m pip install pytest -r requirements-dev.txt
      - name: 运行自动化测试
        run: python -m pytest -q
      - name: 校验协议 Schema
        run: python docs/global/contracts/validate_schemas.py
